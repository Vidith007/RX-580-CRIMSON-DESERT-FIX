; dx12bridge - Crimson Desert / RX 580 2048SP (Polaris, GCN4)
;
; This is the LAYERED configuration. Two things sit between the game and the
; hardware:
;
;   CrimsonDesert.exe
;     -> bin64\d3d12.dll         this shim
;        -> bin64\vkd3d\d3d12.dll + d3d12core.dll   vkd3d-proton (D3D12 -> Vulkan)
;           -> AMD Vulkan driver -> Polaris
;
; The split matters. vkd3d-proton genuinely implements almost everything the
; engine asks for on this card - barycentrics, view instancing, ROVs,
; conservative rasterisation - so those are NOT forged here; forging a cap that
; is already real would only risk overwriting a correct answer with a wrong one.
; The shim forges exactly one thing: variable rate shading. See [spoof] below.
;
; The System32 d3d12.dll and the game's own Agility SDK core in bin64\d3d12\
; are bypassed entirely, because vkd3d ignores D3D12SDKPath / D3D12SDKVersion
; and loads its own core. Both files are left on disk, untouched.

[general]
Enabled=1

; 0=off 1=error 2=info 3=trace. Leave at 2 until it launches, then drop to 1.
LogLevel=2

; Log every CheckFeatureSupport the engine makes and what it got back, marking
; the ones this shim altered. This is the only way to find out which cap the
; engine is really gating on, so it is worth the disk noise while bringing it up.
TraceFeatureQueries=0

; Chain into vkd3d-proton instead of the AMD D3D12 driver. Relative to this
; folder. Set to "system" to go straight to the driver instead - useful for
; A/B testing whether vkd3d is actually helping.
RealD3D12=vkd3d\d3d12.dll

; Environment for the layer below. Set here rather than in a launcher script
; because Steam starts the exe directly, with no shell in between. Anything
; already set in the real environment wins over these.
[env]
; vkd3d-proton reports feature level 12_0 on Polaris unless told to aim higher,
; and 12_1 is what switches on ROVs and conservative raster - the two caps the
; engine's RasterizerOrderedViews feature actually needs.
;
; Do NOT raise this to 12_2. That would also make vkd3d claim mesh shaders,
; sampler feedback and raytracing, none of which Polaris has in any form. The
; engine would then build pipelines it cannot possibly run.
VKD3D_FEATURE_LEVEL=12_1
VKD3D_DEBUG=err

; ============================================================================
; THE FIX for VK_ERROR_UNKNOWN (-13) on graphics pipeline creation.
; ============================================================================
;
; AMD's Polaris driver cannot compile a graphics pipeline whose descriptor set
; layouts use VK_DESCRIPTOR_TYPE_MUTABLE_EXT. vkd3d builds mutable-type layouts
; for its bindless heaps whenever the extension is present (state.c:7011-7024,
; VKD3D_BINDLESS_MUTABLE_TYPE), so nearly every graphics pipeline in the game
; was rejected. Compute was untouched, which is why CreateComputePipelineState
; FAILED always measured 0 and why this hid behind four other hypotheses.
;
; Found by tools/struct_ab.py, which sweeps 17 structural levers against
; bin64/pso-capture via gfxreplay. One row flipped, cleanly, on one variable:
;
;   baseline                                 -> 0x8007000E
;   no graphics_pipeline_library             -> 0x8007000E
;   no descriptor_buffer                     -> 0x8007000E
;   no mutable_descriptor_type               -> 0x00000000  <<< S_OK
;   no extended_dynamic_state2+3             -> 0x8007000E
;   cfg pipeline_library_ignore_spirv        -> 0x8007000E
;   kitchen sink (everything else at once)   -> 0x8007000E
;
; The kitchen-sink row failing is the control that matters: it disabled six
; other extensions simultaneously and changed nothing, so the flip is
; attributable to mutable descriptor type alone and not to disabling extensions
; in general.
;
; Not a spec violation - validation measured 0 errors and spirv-val passes - so
; this is a driver compiler-backend limit, in the same family as the fp16 gate
; below but on the descriptor layout rather than the shader.
;
; Cost: vkd3d falls back to one descriptor set per descriptor type instead of a
; single mutable set. That is more bound sets and slightly slower descriptor
; copies, not a loss of function; it is the same path used on any GPU without
; the extension. Both the EXT and VALVE aliases must be listed, because vkd3d
; accepts either (device.c:116 and :157) and will use whichever remains.
;
; Comma-separated, matched against literal extension names by device.c:188.
;
; ----------------------------------------------------------------------------
; TEST 4 (2026-08-11): capture the hanging PSO. Guessing is over.
; ----------------------------------------------------------------------------
;
; Test 1 (mutable type off) WORKED as far as it went: graphics pipeline failures
; went from 20-of-21 real compiles to 0 of 445, no descriptor-set overflow,
; swapchain up at 1600x900, and the game reached real deferred G-buffer passes
; (rtCount=4). It then HUNG instead of crashing.
;
; The hang is inside the driver, not in our code. The vkd3d log's last entry is
; the "gfx boundary" line, which state.c:6490 prints immediately BEFORE
; vkCreateGraphicsPipelines at state.c:6513, and the shim log's last entry is a
; memory[pso-before] with no matching memory[pso-after]. Both logs stop at the
; entry to the same call on the same thread and never resume. Not one
; "vkWaitForPresentKHR frame latency" line (swapchain.c:3755, INFO level) was
; ever emitted, so no frame ever presented - hence no picture and no audio.
;
; What is now RULED OUT:
;
;   Deadlock. tools/hangdiag.py, on the live hung process, measured 95.3% of one
;   core with a single game instance and the pipeline cache NOT locked. The
;   driver is SPINNING. That kills the whole lock-contention family
;   (vkd3d-proton.cache.write, present-wait on UINT64_MAX, a stale second
;   instance).
;
;   Structural extension levers. tools/combo_ab.py swept nine combinations that
;   all keep mutable disabled, including descriptor_buffer +
;   graphics_pipeline_library and an everything-structural row. All nine returned
;   S_OK and none timed out - so bin64/pso-capture does NOT contain the pipeline
;   that hangs, and none of those levers is supported by evidence.
;
;   The optimiser. TEST 3 set VK_PIPELINE_CREATE_DISABLE_OPTIMIZATION_BIT on
;   every graphics pipeline and the hang reproduced BIT-IDENTICALLY: same 1690
;   pipelines created / 1680 returned, same hung fingerprint, one core at 101%.
;   The bit was provably applied - the boundary lines read flags=0x20000001 where
;   the previous run read 0x20000000, and 0x1 is that bit. So the loop is in a
;   pass AMD cannot skip, or AMD ignores the request. Either way it is not a knob
;   we can reach from here, and the flag is back to 0 below to stop it confounding
;   this run's shader quality for nothing.
;
; The binding constraint is now that there is no offline repro: every hypothesis
; costs a full multi-minute launch. So this run changes nothing the driver sees
; and instead answers "WHICH pipeline?" - see CaptureHangingPSO in the
; [diagnostics] section. The shim writes each PSO to bin64\pso-hang\t<threadid>\
; before calling into the driver and deletes it the moment the call returns, so
; whatever directory still holds a manifest.ini after the hang IS the pipeline
; the driver never came back from. That gets us a gfxreplay repro and
; seconds-long iteration instead of minutes.
;
; Extensions stay on the Test 1 line, plus VK_EXT_descriptor_buffer.
;
; WHY descriptor_buffer JOINED THE LIST. Every graphics pipeline this game creates
; carries flags bit 0x20000000 = VK_PIPELINE_CREATE_DESCRIPTOR_BUFFER_BIT_EXT.
; Almost all of them also carry 0x100 = FAIL_ON_PIPELINE_COMPILE_REQUIRED, which
; makes the driver return early instead of compiling - so of 2125 pipeline
; creations only 7 were real compiles, and 11 of 11 real compiles in the two runs
; on 2026-08-12 were refused with VK_ERROR_INITIALIZATION_FAILED.
;
; The shaders are NOT what is refused. Both stages of every refused pipeline were
; replaced with ~1800-word validated stubs (captures/run-13stubs,
; captures/run-19stubs-allstages) and the refusal count did not move: 11 subs, 11
; real compiles, 11 refusals. What is left is the state, and the descriptor buffer
; bit is the one piece of that state Polaris' compiler has already been caught on
; once before - VK_EXT_mutable_descriptor_type on the line below took graphics
; pipeline failures to 0 by exactly this mechanism, an extension the driver
; advertises but its shader compiler cannot honour.
;
; vkd3d treats this as optional (libs/vkd3d/device.c:119, gated on
; vulkan_info->EXT_descriptor_buffer, with plain descriptor-set device variants
; alongside the descriptor_buffer_* ones), so turning it off falls back rather
; than failing device creation. It does invalidate the pipeline cache - the cache
; key hashes descriptor sizes (device.c:10362) - so expect a slow first launch.
;
; WHY shader_module_identifier JOINED THE LIST, 2026-08-16. This is the fix for
; "it compiles the shaders on every single launch".
;
; vkd3d-proton keeps its own disk cache, on by default, at
; bin64\vkd3d-proton.cache (+ .cache.write, merged at startup). Reading that file
; with tools/cachestat.py shows what it is really storing:
;
;   853184 bytes, 3450 entries
;     PIPELINE       3450 entries   770336 bytes payload (avg 223)
;     SPIRV             0
;     DRIVER_CACHE      0
;   cache_uuid 414d444d6574726f4861736831323800 = "AMDMetroHash128"
;
; Nothing but 223-byte metadata records. No SPIR-V, no compiled code. That uuid is
; the giveaway: cache.c:1942 only writes shaderModuleIdentifierAlgorithmUUID there
; when the library has VKD3D_PIPELINE_LIBRARY_FLAG_SHADER_IDENTIFIER, and
; cache.c:3292 sets that flag whenever the driver reports shaderModuleIdentifier.
; AMD's Polaris driver does report it. So vkd3d stored a 32-byte *identifier* per
; shader instead of the shader, i.e. a claim ticket against the driver's own cache
; rather than anything it can rebuild from.
;
; That makes the whole file worthless here, because the ticket is only redeemable
; while AMD's PAL cache (%LOCALAPPDATA%\AMD\VkCache\*.parc) still holds the module,
; and PAL is writing a fresh _N archive per launch rather than reusing one. Every
; lookup misses, vkd3d clears FAIL_ON_PIPELINE_COMPILE_REQUIRED and recompiles
; (state.c:3183, state.c:6583) - correct, silent, and a full recompile every time.
;
; With the extension off, vulkan_info->EXT_shader_module_identifier is false, so
; device.c:2203 never queries the feature, cache.c:3292 falls through to
; VKD3D_PIPELINE_LIBRARY_FLAG_SAVE_FULL_SPIRV, and the cache stores real SPIR-V
; that vkd3d can hand to the driver without needing PAL to remember anything. That
; skips DXIL->SPIR-V on launch two. It does NOT skip AMD's SPIR-V->ISA compile;
; that still needs DRIVER_CACHE entries, which vkd3d deliberately does not write
; for its internal cache (cache.c:3286 omits SAVE_PSO_BLOB, and device.c:1159
; force-enables global_pipeline_cache so every PSO's vk_pso_cache is VK_NULL_HANDLE
; at state.c:5999). Fixing that half needs a vkd3d patch, not an ini line.
;
; Expect the cache file to grow from ~1 MB to tens of MB. Delete
; vkd3d-proton.cache* when changing this line: the old identifier-keyed entries
; describe SPIR-V that is not in the archive.
VKD3D_DISABLE_EXTENSIONS=VK_EXT_mutable_descriptor_type,VK_VALVE_mutable_descriptor_type,VK_EXT_descriptor_buffer,VK_EXT_shader_module_identifier

; Persist the COMPILED AMD ISA in vkd3d-proton.cache, not just the SPIR-V.
; This is the other half of the "recompiles every launch" fix, and unlike the
; line above it needed a vkd3d source patch - it does nothing on stock vkd3d.
;
; WHY IT WAS NEEDED. Disabling shader_module_identifier above only recovers the
; DXIL->SPIR-V half of load time. AMD's SPIR-V->ISA compile is the expensive
; half, and stock vkd3d deliberately does not persist it for its internal disk
; cache: cache.c omitted SAVE_PSO_BLOB with the comment "we expect the driver
; cache deals with PSO blobs", and device.c force-enabled global_pipeline_cache
; whenever the disk cache is on, which leaves every PSO's vk_pso_cache as
; VK_NULL_HANDLE (state.c:5999). vkd3d then hands VK_NULL_HANDLE to
; vkCreate*Pipelines and AMD PAL is the ONLY thing that can make launch two
; fast.
;
; That assumption is false on this box. PAL writes a brand-new ~50 MB archive
; per launch under %LOCALAPPDATA%\AMD\VkCache\ (.parc, _1, _2 - three files,
; near-identical sizes, three full compiles of the same workload) and never
; reuses one. Measured with tools/cachestat.py: the 853 KB cache held 3450
; PIPELINE metadata entries averaging 223 bytes, ZERO SPIRV entries and ZERO
; DRIVER_CACHE entries. Nothing that costs time to produce was in there.
;
; WHAT THE PATCH DOES. With this at 1, vkd3d keeps a private VkPipelineCache per
; PSO and serializes it into the archive as DRIVER_CACHE entries, keyed by
; pipelineCacheUUID so a driver update invalidates them instead of serving stale
; ISA. The reader side already existed and was simply never fed
; (cache.c:2315 routes DRIVER_CACHE entries into driver_cache_map;
; cache.c:1085 writes the PIPELINE_CACHE_LINK chunk that points at them).
;
; The patch also forces SAVE_FULL_SPIRV and refuses SHADER_IDENTIFIER, because
; d3d12_pipeline_library_init rejects the identifier alongside either of those
; with E_INVALIDARG (cache.c:2525). So this line is self-sufficient - it does
; not depend on shader_module_identifier being in the disable list above.
;
; COSTS, honestly. The cache file grows from ~1 MB to tens of MB. Each live PSO
; holds its ISA in host memory; state.c:6003 notes drivers generally stop
; caching internally once we supply our own cache, so this is closer to a move
; than a duplicate, but it is not free on an 8 GB box. If load-time memory
; becomes the problem again, set this back to 0 and only the ISA half regresses.
;
; Delete vkd3d-proton.cache* when changing this line - the old entries have no
; driver blobs and a different header UUID scheme.
;
; ============================ DISABLED 2026-08-16 ============================
; TURNED OFF because it crashes the AMD driver. Measured, three runs, same box:
;
;     run                crashes   gameplay windows (120 frames each)
;     before this flag       0        186     (~22000 frames, ~10 min)
;     flag=1, cold cache     2         41
;     flag=1, warm cache     2         23
;
; The crashes are ACCESS_VIOLATION inside amdvlk64.dll reading through a null
; pointer - amdvlk64.dll+0xCD56B (read of 0xFFFFFFFFFFFFFFFF) on the cold run,
; then amdvlk64.dll+0x1C40644 (read of 0x0) and +0x1CB8574 (read of 0x40) on
; the warm run. Frames #0/#1 of the backtrace are our own VEH handler and
; #2-#4 are ntdll's exception dispatch, so amdvlk64 is genuinely the faulting
; module, not a bad hook.
;
; Mechanism: setting SAVE_PSO_BLOB makes vkd3d keep a per-PSO VkPipelineCache,
; call vkGetPipelineCacheData on it, and on the next launch hand the blob back
; as vkCreatePipelineCache(pInitialData). On Polaris that reuse path is what
; faults. This retroactively explains why PAL writes a brand new ~50 MB archive
; every launch and never reuses one: its cache-reuse path is broken, and this
; flag forced the game down it.
;
; It DID work as designed otherwise - 147.6 MB archive, 2486 SPIRV + 2161
; DRIVER_CACHE + 2163 PIPELINE entries, real pipelineCacheUUID, warm launch log
; 0.57 MB vs 1.05 MB cold, and pipeline refusals went 5 -> 0 because the driver
; was never asked to compile the ones it refuses. None of that is worth a crash
; every ~60 seconds.
;
; The SPIR-V half of the caching win is kept without this flag: with
; VK_EXT_shader_module_identifier disabled (see VKD3D_DISABLE_EXTENSIONS above)
; the stock path already takes SAVE_FULL_SPIRV, so the DXIL->SPIR-V translation
; is still cached. Only the AMD ISA is recompiled, which is the slow-load
; complaint but not a correctness problem.
;
; Do not re-enable without a driver-side fix. If it is ever retried, the honest
; test is gameplay-window count, not load speed - and archive logs first.
; =============================================================================
VKD3D_SHADER_CACHE_PSO_BLOB=0

; Force VK_PIPELINE_CREATE_DISABLE_OPTIMIZATION_BIT on every graphics pipeline.
;
; TRIED AND REFUTED - see TEST 4 above. Left in place at 0 because the source
; support is worth keeping: once the capture names the offending shader, the right
; move may well be to scope this bit to that one pipeline, where the framerate
; cost is negligible. Set to 1 to re-enable without a rebuild.
;
; Implementation note, since no stock vkd3d has this: vkd3d already plumbs the bit
; through both graphics creation paths (state.c:6271 pipeline-library,
; state.c:6469 direct) but only ever sets it from a per-shader DXIL flag,
; VKD3D_SHADER_META_FLAG_DISABLE_OPTIMIZATIONS at state.c:5632. Crimson Desert's
; shaders do not carry that flag, so reaching the bit needed the source change
; that adds vkd3d_force_disable_pipeline_optimization() in state.c.
VKD3D_DISABLE_PIPELINE_OPTIMIZATION=0

; Stop dxil-spirv emitting fp16 in the rasterization stages (vertex, hull,
; domain, geometry, pixel). Compute keeps native fp16, because the DXIL flag
; this gates on - ShaderFlagNativeLowPrecision - is per-shader.
;
; fp16 arithmetic is RULED OUT as the cause of the pipeline failures, but only
; on the second attempt - the first test was not a valid test, and the earlier
; "TESTED AND REFUTED" note here overstated it.
;
; Attempt 1 emitted INVALID SPIR-V, so its failure proved nothing. Clearing
; execution_mode_meta.native_16bit_operations does double duty: it selects fp16
; arithmetic AND the 16-bit buffer storage layout. Buffers moved to 32-bit
; pointers while DXIL Trunc/ZExt kept producing 16-bit integers, and spirv-val
; rejected it. fp16 and int16 are SEPARATE hardware features - vkprobe on this
; card reports shaderFloat16 no, but shaderInt16 YES and
; storageBuffer16BitAccess YES - so only fp16 *math* may be demoted.
;
; Attempt 2 uses a separate execution_mode_meta.fp16_arithmetic_demoted read
; only by support_native_fp16_operations(), plus a matched widen-on-load /
; narrow-on-store pair in dxil_buffer.cpp (the DXIL was compiled for native
; 16-bit, so the buffer really does hold packed halves and that layout cannot be
; renegotiated). After three separate invalid-SPIR-V fixes both modules pass
; spirv-val, the failing VS carries ZERO half arithmetic ops, and the pipeline
; STILL returns VK_ERROR_UNKNOWN (-13). AMD is rejecting valid SPIR-V.
;
; The gate is proven live, not merely deployed. dxil-spirv logs its decision at
; ERR level (the only level that survives: this build defines
; VKD3D_NO_TRACE_MESSAGES, which compiles out TRACE *and* WARN, so the earlier
; silence at LOGI/LOGW proved nothing either way):
;
;   native fp16 gate: model=0 dxil_native16=1 min_precision_native16=0 opt_in=1
;   419 demoted to fp32 for execution model 0   (vertex)
;     7 demoted ... model 1 (hull)   7 model 2 (domain)   1 model 3 (geometry)
;   394 demoted to fp32 for execution model 4   (pixel)
;   156 KEPT native fp16 for execution model 5  (compute)
;
; Compute kept fp16 and CreateComputePipelineState FAILED stayed at 0.
;
; What the failures actually have in common - and it is NOT the vertex shader.
; An earlier note here claimed "the invariant is the VS, not the PS". That was
; too narrow: of the 13 logged failures, one is VS+HS+DS+GS with NO pixel shader
; at all (stages 0x1/0x2/0x4/0x8, rtCount=0, patch topology) while another is a
; plain VS+PS colour pass to an R8G8B8A8_SRGB target. Different stage sets,
; different dynamic state. Dropping the PS from the captured PSO makes it
; succeed outright, so it is not PS content either.
;
; They cluster by ROOT SIGNATURE instead - 13 failures, 3 distinct signatures:
;   fdfe220f3469b4e2 (8x)   e99a72bf42affb44 (4x)   d8f2ad25a1a58771 (1x)
;
; Attachment formats are ruled out: tools/fmt_ab.py varies RT and DSV format
; seven ways (including DSV=UNKNOWN and plain D32_FLOAT) and all seven still
; return 0x8007000E.
;
; That points at the binding / pipeline-construction model, which is what
; tools/struct_ab.py sweeps. Two leads, both graphics-specific in a way that
; explains why compute is unaffected: VK_EXT_graphics_pipeline_library is
; graphics-only by construction, and state.c:6467 sets
; VK_PIPELINE_CREATE_DESCRIPTOR_BUFFER_BIT_EXT (0x20000000 - the base value in
; every "gfx boundary" flags= field) on every graphics pipeline, where GCN4's
; 16 user SGPRs per stage must hold a 2032-byte root signature's worth of
; descriptor addresses across up to 4 stages.
;
; Still worth keeping: it is the correct behaviour for this ASIC regardless of
; this bug. Polaris has scalar fp16 ALUs but no packed math (GFX9/Vega added
; that) and no fp16 denormal support in silicon, and it clears the
; shaderDenormPreserveFloat16 VUID at the source instead of patching SPIR-V
; after the fact. Set to 0 to A/B without a rebuild.
;
; This does NOT change what the engine sees. Native16BitShaderOpsSupported
; below stays 1 - the launch gate is satisfied and the 5 compute shaders that
; genuinely use float16_t still compile. Set to 0 to A/B without a rebuild.
DXIL_SPIRV_GRAPHICS_DISABLE_NATIVE_FP16=0

; Validation and vk_debug were removed for the fp16-gate measurement run.
; They had already answered their question: with the half-float extension
; enabled and spirvfix stripping DenormPreserve-16, both VUIDs that used to
; fire measured exactly 0 - so the -13 rejection happens with validation
; completely clean, which is why it reads as an AMD compiler backend limit
; rather than a spec violation. Keeping the layers on only costs startup time
; and adds noise to the "did the process survive past t+400s" check.
;
; To bring them back for one run, uncomment these three:
;VKD3D_CONFIG=vk_debug
;VK_INSTANCE_LAYERS=VK_LAYER_KHRONOS_validation
;VK_LOADER_LAYERS_ENABLE=VK_LAYER_KHRONOS_validation

; RESULT of the 2026-08-11 pipeline_library_ignore_spirv experiment (flag now
; removed again - it only slows startup):
;
; Read at the time as killing the fp16 hypothesis: failures stayed at 18 across
; the same 4 VS families, apparently proving Float16-carrying shaders compile.
;
; SUPERSEDED. That reading assumed the flag forced all 1538 pipelines through
; AMD's compiler. Counting creation flags directly says otherwise - only 21
; carried flags=0x20000000 (real compile); 1519 carried 0x20000100, the
; identifier fast path, which sets FAIL_ON_PIPELINE_COMPILE_REQUIRED when a
; stage module is VK_NULL_HANDLE (state.c:6464) and is served from AMD's
; on-disk cache without ever compiling. Correlating each failure against the
; boundary line on its own thread: 20 of those 21 real compiles failed. The
; survivor is the VS+HS+DS+GS family. So the fp16-carrying shaders were not
; passing - they were mostly not being compiled.
;
; One loose end: state.c:6548 retries on VK_PIPELINE_COMPILE_REQUIRED with real
; modules, and that retry is NOT covered by the boundary log, so some of the
; 1519 may have compiled unlogged. Deleting AMD's shader cache before a run is
; what settles it - otherwise the fast path masks both success and failure.



; ----------------------------------------------------------------------------
; WORKAROUND (not a fix): stub the one pixel shader Polaris cannot compile.
; ----------------------------------------------------------------------------
;
; c3aeae6f7d8fbfca is a 4-target deferred G-buffer PS. AMD's Polaris shader
; compiler faults on it (amdvlk64.dll +0x21C17E4) inside
; vkCreateGraphicsPipelines; in-game that fault presents as one core spinning
; forever, which is why no frame was ever presented. Every OTHER pipeline in the
; game compiles - 0 of 445 graphics failures once mutable descriptor type was
; disabled - so this single shader is the whole remaining blocker.
;
; spvpatch.py's gut-main row proved the interface is innocent: keep every
; capability, execution mode, descriptor binding, type and IO variable and
; replace only main's body, and the driver returns S_OK. The override here does
; exactly that, writing zeros to all four render targets rather than returning
; without writing (undefined outputs would feed the lighting pass with garbage
; that changes every run).
;
; COST: geometry drawn with this material is unshaded. This buys a running game
; and a live iteration loop; the real fix is still tools/reduce.py narrowing the
; construct AMD chokes on. Delete this key to go back to the hang.
;
; Built and installed by tools/psostub.py. vkd3d_shader_main.c:107 looks for
; <dir>\<hash>.spv, keyed by the same hash VKD3D_SHADER_DUMP_PATH names.


; ----------------------------------------------------------------------------
; How many commands the DGC root-constant emulation will unroll.
; ----------------------------------------------------------------------------
;
; This is the "weird geometry everywhere" lever. The emulation applies each
; command's own root constants by unrolling an ExecuteIndirect into one draw per
; command (command.c:17496). Batches larger than this bound are refused and fall
; back to a real multi-draw, which draws the right geometry but applies NONE of
; the per-command constant overrides - all N draws share the single root
; parameter block the app bound before the call, so a batch of N meshes is drawn
; N times with one mesh's transform and material.
;
; At the old default of 64, two open-world sessions measured:
;
;   bound=64 calls=9084928 cmds=74849777 (biggest 64)
;   rejectRange 65..23249 | ok=6361702 overBound=2723918
;
;   bound=64 calls=1769472 cmds=12268242 (biggest 64)
;   rejectRange 65..21341 | ok=1396282 overBound=373278
;
; 21-30% of indirect calls refused, every one of them a batch of 65 to 23249
; draws. Batches that big are the scenery: foliage, trees, buildings, crowds -
; the same population reported as missing or misplaced.
;
; The refused share is worse than the call percentage suggests. "cmds" counts
; ACCEPTED commands only, which "(biggest 64)" proves, since the largest batch
; seen was 21341. So in the second session 1396282 accepted calls carried
; 12268242 commands (averaging 8.8), while the 373278 refused calls carried at
; least 65 each - at least 24.3M commands, i.e. the majority of the engine's
; indirect geometry, all of it drawn with one shared transform and material.
; captures/frames-dgc1024/7750.png is what that looks like: stretched thin-sliver
; triangle nets and a bare light-volume box standing where meshes should be.
;
; COST, measured at the call site rather than inferred from a counter ratio -
; per command it is 20 bytes of args scratch + sizeof(union
; vkd3d_root_parameter_data) = 256 bytes of root scratch (command.c:8869-8878),
; plus one vkCmdPushDescriptorSetKHR and one vkCmdDrawIndirect recorded:
;
;      64  ->  18 KB scratch,    128 commands   (the old default)
;    1024  -> 283 KB scratch,   2048 commands
;   23249  -> 6.4 MB scratch,  46498 commands   (the observed maximum)
;   65536  ->  18 MB scratch, 131072 commands   (this setting)
;
; 65536 accepts everything, so overBound should read 0. Scratch is not what
; bounds this - 18 MB against 8 GB is nothing - recording time is, and the honest
; caveat is that unrolling costs one draw per *max* command count even when the
; GPU-side count buffer names fewer, so a generous MaxCommandCount is paid in
; full. This value is therefore set to answer one question first: is the fallback
; the cause of the broken geometry? A slow but correct frame answers it; a fast
; wrong one does not. The tally now also prints a power-of-two histogram of
; command counts, so the production value can be picked from the real
; distribution instead of from its min and max.
;
; This lever did NOT work before 2026-08-18 and silently voided a whole capture
; session. vkd3d read it with getenv, but on Windows getenv sees only the CRT's
; environment snapshot taken at process start, and the shim injects these vars
; with SetEnvironmentVariableA after that - which updates the Win32 environment
; block but not the CRT copy. The shim logged "env
; VKD3D_DGC_EMULATE_MAX_COMMANDS=1024" and vkd3d still reported bound=64, exactly
; and correctly. It now reads through vkd3d_get_env_var, which calls
; GetEnvironmentVariableA (platform.c:228), so the value arrives.
;
; The log line prints "bound=" so this setting stays self-verifying: if the next
; run does not say bound=65536, the value did not arrive and the run tells you
; nothing about the fix. That check was in place last time and it worked - the
; reading was believed to be a confirmation when it was a refutation.
VKD3D_DGC_EMULATE_MAX_COMMANDS=65536

[spoof]
FeatureLevel=12_1
ForceCreateDevice=1

; --- the shader cache key -------------------------------------------------
; This is what stopped the game after the device, swapchain and pipelines were
; all already working. The engine keeps a prebuilt shader cache in archive
; 0017, keyed by a name whose last two fields are a hash of the *compile
; environment*. Every one of the ~3567 entries in that index ends in the same
; constant, deba1dcd - one bake, one environment. Ours hashed differently, so
; every lookup missed and the engine treated the miss as fatal:
;
;   PipelineName: SkinnedMeshStandard_mt7
;   Failed to load cache blob ec07ffaf_f2d601c7_0_dad59307_2_266bf188_6b53c5f8
;                                                            ^^^^^^^^^^^^^^^^^
;                                       shipped entries all have deba1dcd_deba1dcd
;
; The differing input is the shader model. Traced in/out, the engine asks for
; 6.6 and vkd3d-proton answers 6.5:
;
;   Q SHADER_MODEL (7, 4 B) in[00000066] hr=0x00000000 [00000065]
;
; so the engine falls back to compiling and looking up at 6.5 while the shipped
; blobs are 6.6. vkd3d withholds 6.6 because some Vulkan sub-feature is missing
; on Polaris, not because the shaders cannot run: the engine's main path is
; bindless (see GBufferCharacterRenderPassBindless in the error above), and
; bindless *is* SM 6.6 dynamic resources, which vkd3d does implement.
;
; Only ever answers what the caller asked for - a request for 6.5 still gets
; 6.5. If a shader turns out to use a 6.6 opcode dxil-spirv cannot translate,
; it will show up as a CreateGraphicsPipelineState failure in the log rather
; than as this silent cache miss.
ShaderModel=6_6

; Engine-visible native-16-bit answer. MUST be 1 - this is a hard gate.
;
; A/B 2026-08-11, two runs whose ini differed in this key ALONE (verified by
; diffing the stripped ini - one line, 1 vs 0):
;
;   =1  engine runs: 1539 PSOs created, 20 fail with E_OUTOFMEMORY, then exit
;   =0  engine creates ZERO PSOs and exits cleanly ~2 s after the swapchain,
;       with no exception, no dump and no failed PSO of any kind
;
; So this cap is not a tuning knob, it is one of the two caps the game gates
; launch on (12_1 being the other). Answering FALSE makes it quit before it
; compiles anything, which reads as "0 failures" in the log and is worthless.
;
; SUPERSEDED, and left here for the A/B above only: the 20 E_OUTOFMEMORY
; failures were NOT an fp16 problem at all. They were Polaris refusing any
; graphics pipeline whose descriptor set layouts used VK_DESCRIPTOR_TYPE_MUTABLE
; - see VKD3D_DISABLE_EXTENSIONS in the [env] section, which took graphics
; pipeline failures to zero. fp16 is ruled out as the rejection cause.
;
; What remains is a different bug with a different shape: AMD's Polaris shader
; compiler faults (or never returns) inside vkCreateGraphicsPipelines on a small
; number of specific FRAGMENT shaders, at amdvlk64.dll+0x21C17E4. It is not
; attributable to fp16, to any declaration, or to any vkd3d configuration - all
; three were swept and refuted. The current answer is per-shader replacement:
; DumpShaderModules below, then tools/scan.py to enumerate the offenders and
; tools/stubgen.py to install a stub for each into shader-substitute/.
Native16BitShaderOpsSupported=1

; Wave lane count: answer honestly. Polaris is wave64 and says so.
;
; This was forged to 32 on 2026-08-06 to "preserve the cache-crossing wave32
; environment key". That rationale does not survive measurement. Two runs whose
; ini differed in this key ALONE report the SAME engine feature bitmask:
;
;   (no key)            Graphics features value: 0x000401e5c4370efc
;   WaveLaneCountMin=32 Graphics features value: 0x000401e5c4370efc
;
; So the forgery bought nothing the engine acts on - the later change in that
; bitmask (0x000441ffe4770efc) came from VariableShadingRateTier 1 -> 2, not from
; this key.
;
; What it DID buy is a crash. Claiming 32 makes the engine select its SM 6.6
; [WaveSize(32)] compute shaders. vkd3d then refuses them in
; d3d12_device_validate_shader_meta (device.c:10830):
;
;   Required WaveSize range [32, 32], but supported range is [64, 64]
;
; which returns E_INVALIDARG from CreateComputePipelineState. The engine does not
; check that return, dereferences the null pipeline state, and dies with
; 0xC0000005 reading 0x10A8 inside d3d12core.dll. Four such failures per run,
; two distinct compute shaders, each attempted twice.
;
; Relaxing vkd3d's validation would not help: with it passed, state.c:2776 sets
; requiredSubgroupSize = min(cs_wave_size_max 32, maxSubgroupSize 64) = 32, and
; the driver refuses that just as flatly. The shader genuinely wants 32 lanes.
; The only honest fix is to stop asking the engine for a wave32 variant.
WaveLaneCountMin=64
WaveLaneCountMax=64

; --- real, supplied by vkd3d - do not touch -------------------------------
; Every one of these was verified reporting correctly through the layered stack
; on this exact card. "keep" means pass the honest answer straight through.
ROVsSupported=keep
ConservativeRasterizationTier=keep
BarycentricsSupported=keep
; vkd3d gives this TIER_2 for real, but only when the exe is named
; CrimsonDesert.exe - it has a per-application profile keyed on that name.
ViewInstancingTier=keep
EnhancedBarriersSupported=keep
RelaxedFormatCastingSupported=keep

; --- the one forgery ------------------------------------------------------
; vkd3d can fake VRS on GCN, and does - but it gates the fake on
; minSubgroupSize == 32 to scope it to RDNA1. Polaris is wave64, so it falls
; through to TIER_NOT_SUPPORTED. That gate is about which GPU generation the
; workaround was written for, not about anything wave64 cannot do: the
; workaround is a cap lie plus a shader quirk, and neither depends on wave size.
;
; The cache-crossing experiment proved that the shipped shader family is selected
; only when the engine sees Tier 2, so this remains an explicit compatibility
; claim. Command-list VRS and shader-declared primitive shading rate are no-oped;
; shading-rate-image semantics still are not genuinely implemented on Polaris.
VariableShadingRateTier=2
; Give the engine a plausible power-of-two tile size for the Tier 2 identity.
ShadingRateImageTileSize=8
AdditionalShadingRatesSupported=keep

; --- deliberately NOT forged ----------------------------------------------
; Polaris has no mesh shaders, no sampler feedback, no raytracing hardware and
; no emulation path for any of them. Claiming them gets you a crash during
; pipeline creation instead of a clean error dialog, which is strictly worse.
MeshShaderTier=keep
SamplerFeedbackTier=keep
RaytracingTier=keep

[diagnostics]
; Force vkd3d's log to a deterministic game-local path before d3d12core loads.
; Unlike an inherited VKD3D_LOG_FILE, this controlled destination cannot silently
; point at a stale file elsewhere. Informational logging is required to prove the
; custom Crimson Desert shader profile is active.
Vkd3dLogFile=vkd3d-capture2.log

; Capture one unique failed graphics PSO package for the standalone replayer.
; This writes only the post-fixup stream and its referenced shader/state data.
CaptureFailedGraphicsPSO=1
PsoCaptureDirectory=pso-capture

; THE POINT OF THIS RUN. Capture the PSO the driver never returns from.
;
; CaptureFailedGraphicsPSO above cannot see this bug, because a hang is not a
; failure - the call never comes back, so there is no HRESULT and nothing ever
; reaches the failure path. This writes the same kind of package BEFORE the call
; and deletes it as soon as the call returns, into one subdirectory per thread:
;
;   bin64\pso-hang\t<threadid>\{manifest.ini, stream.bin, <stage>-<hash>.dxil, ...}
;
; So at any instant the only packages on disk are the ones currently inside
; vkCreateGraphicsPipelines. After the hang, every worker thread that finished
; will have cleaned up after itself and the hung one cannot - so whatever is left
; IS the culprit, with its shader bytecode next to it. Copy that directory over
; bin64\pso-capture and gfxreplay.exe reproduces the hang in seconds instead of
; the four minutes a game launch costs.
;
; Per-thread is not optional: the game runs concurrent PSO compile workers, and a
; single shared directory would have them overwrite each other's packages and then
; delete the survivor on their own way out.
;
; Cost: one stream + manifest + up to five shader blobs written and deleted per
; PSO, ~1700 PSOs, on the compile threads' critical path. Expect a noticeably
; slower startup. Turn this OFF once the culprit is captured - it is a diagnostic,
; not a fix, and the extra I/O perturbs timing.
CaptureHangingPSO=0
PsoHangDirectory=pso-hang

; Process working-set/private-commit telemetry at device and PSO boundaries.
; This does not change feature answers or allocation behavior.
MemoryTelemetry=1


; Log one line per SPIR-V module with its content hash and word count.
; This is how a substitution key in bin64\shader-substitute is
; discovered, and how a key that stopped matching is corrected. One log
; line per shader, so it is a diagnostic, not something to leave on.
LogShaderModuleHashes=0

; Count draw and dispatch calls, reporting every 120 presents.
;
; This is the measurement for the current defect: in-game, terrain, sky and
; water render and NOTHING else does - no characters, no NPCs, no trees, no
; props. Those two sets differ in HOW they are drawn, not in what they are.
; Terrain and sky are a handful of direct draws; every tree, prop and
; character arrives as instanced geometry, usually through ExecuteIndirect
; with a GPU-computed instance list and draw count.
;
; So the bug is in one of two halves, and no log we have separates them:
;
;   draws never recorded, or recorded with instanceCount == 0
;     -> fault is upstream, in culling / instance-list construction
;   draws recorded with sane counts but nothing appears
;     -> fault is downstream, in per-instance data, transforms or shading
;
; Read the drawcount[window] lines: instanceCount zero= is the discriminator.
; These are the hottest functions in the process, so with this at 0 the shim
; hands vkd3d the driver's own pointer and the run is bit-for-bit unhooked.
LogDrawCalls=1

; Write every distinct SPIR-V module the driver is handed to
; ShaderDumpDirectory\<content hash>.spv, once each, ever. This is the
; input to tools/scan.py, which tests every dumped fragment shader
; against the offline oracle and so finds EVERY module that faults the
; Polaris compiler in one pass instead of one game launch per shader.
; VKD3D_SHADER_DUMP_PATH would collect the same bytes but is one of the
; three variables device.c:1133 reacts to, so it would disable pipeline
; caching and change the run being measured. Turn off once the scan has
; what it needs; the files are large.
;
; OFF as of 2026-08-16: the scan has what it needs (3375 modules, twice over
; in shader-dump and shader-dump-demoted-20260816). Leaving it on costs ~260
; MB of writes and real load time on a box that is already short of both.
DumpShaderModules=0
ShaderDumpDirectory=shader-dump

; Seconds a thread may sit inside one pipeline-creation call before the
; shim declares it wedged and names the shader modules it was handed.
; The compiler bug has two faces - an access violation the driver
; swallows, and a compile that never returns - and only the first leaves
; a stack behind. 0 disables the watchdog.
PsoStallSeconds=45
[fixups]
SubgroupSizeSpoof=3
; vkd3d implements conservative raster for real at 12_1, so leave the pipeline
; state alone. Only turn this on if you switch RealD3D12 back to "system".
StripConservativeRaster=0

; Having claimed VRS above, the engine will call RSSetShadingRate. Swallow the
; command-list calls so all draws remain full-rate. This alone cannot remove a
; shader-declared SV_ShadingRate output. The bundled custom vkd3d backend applies
; IGNORE_PRIMITIVE_SHADING_RATE through Crimson Desert's application profile so
; that shader output is removed before AMD's Polaris Vulkan compiler sees it.
NoopShadingRate=1

; VIEW_INSTANCING removal was tested with the exact failing PSO family: streams
; compacted cleanly from 832 to 800 bytes, but vkCreateGraphicsPipelines still
; failed with VK_ERROR_OUT_OF_HOST_MEMORY. Keep this experimental fix disabled
; for the backend-quirk A/B so only primitive shading-rate handling changes.
StripViewInstancing=0

; Record HRESULT and stable shader fingerprints for any remaining PSO failure.
LogPipelineStateFailures=1

; A/B 2026-08-10 RESULT: FP16-off killed all graphics failures (0x 0x8007000E,
; swapchain created, ~251 pipelines cached) but broke 5 compute shaders that
; genuinely need native FP16 (E_INVALIDARG). Root cause: AMD Polaris Windows
; Vulkan accepts FP16 in compute, rejects it in graphics pipelines. Proper fix
; built: vkd3d quirk VKD3D_SHADER_QUIRK_GFX_MIN16_AS_32BIT demotes min16float to
; 32-bit for non-compute stages only (state.c vkd3d_compile_shader_stage), so
; the device feature stays ON. Keep this at 1 from now on.
ForceVulkanFloat16=1

; Report a smaller maxPushConstantsSize than Polaris claims (128), so vkd3d
; moves the root constants of overflowing root signatures into a uniform buffer
; instead of a push constant range this compiler cannot build a pipeline from.
;
; Measured 2026-08-15 (captures/run-layoutcap2). Of 32 pipeline layouts in a
; launch, exactly ONE took every vkCreateGraphicsPipelines refusal and never
; once succeeded. It differs from a layout that always succeeds in one field -
; their descriptor sets are literally the same objects, identical handles for
; sets 0..6, and set 7 the same 13 immutable samplers:
;
;   REFUSED 2f00ca0   sets=8  pushRanges=1  pushBytes=88
;   PASSES  c02208e0  sets=8  pushRanges=1  pushBytes=52
;
; 88 bytes is legal against the advertised 128, so state.c:1488 never trips and
; vkd3d has no reason to take its own fallback. 64 makes it trip for exactly the
; root signatures that overflow, and leaves the 52-byte ones untouched. If -3
; refusals persist, read the "push constant curve" block in the log and drop
; this to the next value below the lowest failing pushBytes. 0 = leave alone.
;
; RESULT 2026-08-15 (captures/run-pushclamp64): REFUTED, and reverted to 0.
; Setting 64 worked mechanically - vkd3d took the fallback and built 9-set
; layouts with pushBytes=0 - but those layouts get refused too, so push constant
; size is not the mechanism. Measured against captures/run-layoutcap2:
;
;   vr -3 from vkCreateGraphicsPipelines   10 -> 9    (unchanged)
;   E_FAIL PSO stream failures              0 -> 26   (much worse)
;
; The 88-vs-52 observation was real but not causal. Leave this at 0 unless a new
; measurement puts push constants back in the frame.
MaxPushConstantsSize=0

; Strip the pixel shader from PSOs whose RENDER_TARGET_FORMATS has
; NumRenderTargets == 0 (depth-only / Z-prepass).
;
; vkd3d-proton builds pipeline variants lazily at draw time. The depth-only
; variant (rtCount=0, flags=0x20000000) still carries the PS from the original
; PSO even though a pure Z-prepass writes no colour. AMD's Polaris Vulkan
; compiler rejects that attachment/interface mismatch with VK_ERROR_UNKNOWN
; (-13), which vkd3d maps to E_OUTOFMEMORY (0x8007000E). The identical PS
; compiles fine in the rtCount=5 colour variant, which is what proves the
; trigger is pipeline state and not the shader body.
;
; Measured, two controlled runs: 32 PSOs stripped; all three previously failing
; families (4C86AA5E88F41908, 1E199C94CEA292B1, 53E232A58E73E7E1) went to zero
; failures, 17 -> 4 overall. vkd3d confirms 35 rtCount=0 stages=1 variants now
; all compile. The remaining 4 are a separate VS+HS+DS+GS patch-list family this
; fixup never touches (they already carry no PS); they were previously queued
; behind the 17 and only became visible once those stopped failing.
;
; NO LONGER A BOOLEAN, 2026-08-16. Removing a depth-only pass's pixel shader is
; only free when the shader has no side effects, and the census above was never
; checked for that: the stripped shaders average 14 KB and reach 22 KB, which is
; far more than an inert colour-only shader needs. A PS bound to a depth-only
; pass is usually there for a side effect - writing SV_Depth, writing a UAV
; (which is how a GPU-driven renderer records the per-object visibility that
; feeds the instance lists trees, props and characters are drawn from), or
; calling discard so alpha-tested foliage keeps its shape in the depth buffer.
; Strip it and the effect vanishes with no error at all: either the instance
; lists come out empty, or the depth buffer fills with solid quads that occlude
; everything behind them. Both look exactly like the current defect, where
; terrain and sky render and nothing else does.
;
; Also note the original justification no longer applies on its own terms: since
; the FragmentShadingRateKHR fix, a full launch shows zero pipeline refusals,
; zero VkResult=-3 and zero E_OUTOFMEMORY, so nothing is currently being refused
; for this fixup to rescue.
;
;   0 = never strip.
;   1 = strip only shaders src/shim/dxbc.cpp can show are inert - no UAV write,
;       no SV_Depth, no SV_StencilRef, no ROV, no InnerCoverage, and at least one
;       colour output (a PS with none can only act through discard). The verdict
;       for every depth-only PSO is logged either way, so one launch yields both
;       the fix and the evidence.
;   2 = strip unconditionally, the pre-2026-08-16 behaviour, kept for A/B.
;   3 = keep every depth-only pixel shader, and drop one only if the driver
;       refuses that pipeline. The shim retries CreatePipelineState once with the
;       PS removed, so a refusal recovers to exactly what mode 2 produced for
;       that PSO and nothing else is affected. No prediction, no blind spot.
;
; SET TO 0, 2026-08-16, on the evidence from mode 1's own census:
;   seen=768 stripped=345 kept=423
; Mode 1 keeps the 423 shaders that have no colour output (discard-only), but it
; still strips the other 345 - and "has a colour output" does NOT make a shader
; safe to remove from a depth-only pass. An alpha-tested material shader has both
; SV_Target and discard; the colour write goes nowhere with no RTs bound, but the
; discard is what carves the foliage silhouette into the depth buffer. Strip it
; and the quad writes solid depth, so whatever stands behind a tree gets
; depth-rejected or Hi-Z culled. discard is invisible to dxbc.cpp - seeing it
; needs a DXIL bitcode walk the parser does not do - so mode 1 cannot tell the
; 345 safe strips from the dangerous ones. With zero refusals left for the fixup
; to rescue, keeping all 768 costs nothing and removes a whole silent failure
; mode. A kept shader can only cause a refusal, which the log states plainly.
; REVERTED TO 1, 2026-08-16. Mode 0 was tried and backed out: keeping all 768
; pixel shaders adds ~345 extra shader compiles to a load that is already the
; worst problem this build has, and it produced no visible improvement - the
; screen was black either way. The discard risk documented above is real but it
; is latent, and it is not worth paying load time for until the load itself is
; fixed. Revisit once the pipeline cache actually persists across launches.
;
; SET TO 3, 2026-08-17. Both objections that pinned this at 2 are now answered.
; The latent discard risk is no longer latent: with the DGC root-constant fix in,
; the world renders, and it renders covered in flat black shards - leaf-shaped
; flakes in the sky, thin spikes over terrain, a head floating with no body. That
; is precisely the failure this comment predicted: an alpha-test quad writing
; solid depth in the prepass, so the colour pass depth-rejects the sky, terrain
; or torso behind it and the cleared black shows through. And the load-time
; objection is spent - VKD3D_SHADER_CACHE_PSO_BLOB now persists a 147 MB cache
; across launches, so the extra compiles are paid once rather than every launch.
; Mode 3 also removes the reason mode 0 was dangerous: the refusals that killed
; the mode 0 run now recover automatically instead of reaching the engine.
StripPSFromDepthOnly=3

; Census of indirect draws ABOVE vkd3d. Without VK_EXT_device_generated_commands
; vkd3d returns S_OK from CreateCommandSignature for a signature that carries
; per-draw root arguments, then silently discards every ExecuteIndirect using it
; (command.c:25560 and command.c:17159) - no Vulkan call, so LogDrawCalls cannot
; see it. Log-only: every call is still forwarded.
LogIndirect=1

; On a failed PSO compile, retry once without the geometry shader.
; VS+HS+DS+GS patch-list pipelines fail on Polaris with VK_ERROR_UNKNOWN (-13).
; Removing the GS lets tessellation compile; geometry amplification is lost for
; those four depth-prepass PSOs but the engine gets S_OK instead of a fatal
; E_OUTOFMEMORY. Every recovery is logged ("recovered by dropping GS").
RetryPSOWithoutGS=1

; Leave normal parallel pipeline compilation enabled. The 04:45 controlled run
; reached 3.56 GiB working set (4.03 GiB peak) and still failed only on the same
; deterministic VS/PS family, so serializing all PSO workers did not prevent the
; crash and makes Windows report long transient hangs. Set to 1 only for a narrow
; low-memory diagnostic A/B.
SerializePipelineCompilation=0

; ---- pipeline-state bisection -----------------------------------------------
;
; When vkCreateGraphicsPipelines returns VK_ERROR_INITIALIZATION_FAILED, rebuild
; the SAME pipeline with one piece of state relaxed at a time and log which
; relaxation compiles. src/shim/pipefallback.cpp.
;
; WHY. The refusal is not the shaders and not the descriptor model:
;   - Both stages of every refused pipeline were replaced with ~1800-word
;     validated stubs that write zero and return. 11 substitutions, 11 real
;     compiles, 11 refusals - the count did not move
;     (captures/run-13stubs, captures/run-19stubs-allstages).
;   - Removing VK_EXT_descriptor_buffer changed the flags the driver sees from
;     0x20000100 to 0x100 and invalidated the pipeline cache, forcing 629 fresh
;     compiles. 624 succeeded, 5 were refused (captures/run-nodescbuf).
; So a handful of specific pipelines are rejected while 624 of their neighbours
; compile, and what is left to differ is the fixed-function state and the
; pipeline layout. Ten hypotheses at ~20 minutes per launch is a week; probing
; them inside the failing call is one launch.
;
; WHAT IT LOGS. Per refusal: the Vulkan-side description (layout handle, dynamic
; rendering attachment formats, depth/stencil enables, blend), a table of every
; VkPipelineLayout seen with its ok/fail counts - which is the test of whether
; vkd3d root signature 594c336e9ba03fc is really unique to the failures, since
; all three failing runs named it while their shader sets were disjoint - and one
; line per probe with the VkResult.
;
; WHAT IT COSTS WHEN Apply=1. The first relaxation that both compiles and is
; still legal for the attachments the game binds is handed back to vkd3d, so the
; game continues with that pipeline. Those draws render wrong (no blend, or no
; depth test, depending on which one compiled) and the log names which. Probes
; that change an attachment FORMAT are never handed back: a pipeline whose
; formats disagree with the render pass is undefined behaviour, not a workaround.
PipelineFallback=1
PipelineFallbackApply=1
; Each probe is a real compile on a compiler that takes seconds over these, and
; the fifth refused pipeline does not tell us anything the first four did not.
; Dropped 8 -> 4 when the probe list grew to 17: at 8 refusals that is ~136 real
; compiles on a slow compiler, and the last run showed all six probed refusals
; giving identical answers on every single probe. Four is already redundant.
PipelineFallbackLimit=4

; The game ships precompiled pipeline blobs in its own archives, baked by AMD's
; D3D12 driver, and hands them to CreateGraphicsPipelineState as CachedPSO. A
; cache blob is only valid for the driver that produced it, so vkd3d-proton
; rejects them - and the engine treats that as fatal instead of recompiling:
;
;   RenderPassName: GBufferCharacterRenderPassBindless
;   PipelineName: SkinnedMeshStandard_mt7
;   Failed to load cache blob ec07ffaf_f2d601c7_0_dad59307_1_014647cb_c5c3cd37
;
; ...followed immediately by a C++ exception (0xE06D7363) and a dump. Presenting
; an empty blob is the documented "no cache" value: the runtime then compiles
; from the bytecode that is already in the same desc.
;
; Cost is a longer first run while vkd3d builds its own cache - that is what
; bin64/vkd3d-proton.cache is for, so the wait is paid once, not every launch.
StripCachedPSO=1

; CrimsonDesert.exe imports agsDriverExtensionsDX12_CreateDevice, so its D3D12
; device is built by AMD GPU Services, which then probes AMD driver extensions
; on the result through amdxc64.dll. Those extensions live in AMD's own D3D12
; driver. Once RealD3D12 points at vkd3d-proton the probe gets nothing back and
; dereferences it: the game's own crash dump named amdxc64.dll+0x88069 reading
; address 0x40, one second after the launcher logged "AGS Library initialized".
;
; Making agsInitialize report "no AMD driver installed" is the same answer AGS
; gives on an NVIDIA or Intel card, so the engine falls back to a path it ships
; tested rather than one invented here.
DisableAmdAgs=1

; Narrow safety net for any remaining hardware-support popup. Only swallows text
; that names a graphics subject *and* reads as a refusal, so genuine errors
; still reach you.
SuppressGpuDialog=1

[adapter]
; Only relevant once the dxgi shim is installed. The engine carries a hardcoded
; GPU name table whose lowest entries are GTX 1070 and RX 6600; RX 580 is not in
; it. That table drives a different error message ("The graphics device is
; currently not supported.") than the one this card produces, so identity is not
