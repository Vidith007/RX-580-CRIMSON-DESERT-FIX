; ----------------------------------------------------------------------------
; WORKAROUND (not a fix): stub the one pixel shader Polaris cannot compile.
; ----------------------------------------------------------------------------
;
; c3aeae6f7d8fbfca is a 4-target deferred G-buffer PS. AMD's Polaris shader
; compiler faults on it (amdvlk64.dll +0x21C17E4) inside
; vkCreateGraphicsPipelines; in-game that fault presents as one core spinning
; forever, which is why no frame was ever presented. Every OTHER pipeline in the
; game compiles - 0 of 445 graphics failures once mutable descriptor type was
; disabled - so this single shader is the whole remaining blocker.
;
; spvpatch.py's gut-main row proved the interface is innocent: keep every
; capability, execution mode, descriptor binding, type and IO variable and
; replace only main's body, and the driver returns S_OK. The override here does
; exactly that, writing zeros to all four render targets rather than returning
; without writing (undefined outputs would feed the lighting pass with garbage
; that changes every run).
;
; COST: geometry drawn with this material is unshaded. This buys a running game
; and a live iteration loop; the real fix is still tools/reduce.py narrowing the
; construct AMD chokes on. Delete this key to go back to the hang.
;
; Built and installed by tools/psostub.py. vkd3d_shader_main.c:107 looks for
; <dir>\<hash>.spv, keyed by the same hash VKD3D_SHADER_DUMP_PATH names.
